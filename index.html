<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Inference Engineering - FE</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-content">
        <h1>Computer Vision Inference Engineering - Image Classification</h1>
        <p>Upload an image and run inference to see what the model predicts</p>
    </header>
    <main class="main-content">
        <div class="prediction-container">
            <div class="prediction-info">
                <h3>Image Input</h3>
                <p>Model details: MobileNetV4 - ImageNet</p>
            </div>
            <div class="image-container">
                <img id="image-preview" class="image-preview hidden" alt="Image preview">
            </div>
            <form action="submit" method="post" id="prediction-form">
                <input type="file" name="image-submit" id="image-submit" accept="image/*" class="hidden">
                <label for="image-submit" class="upload-button">Please Upload an Image</label>

                <div class="image-metadata">
                    <p></p>
                </div>
                <div class="btn-container">
                    <button type="reset" id="reset">Reset</button>
                    <button type="submit" id="predict">
                        Predict
                    </button>
                </div>
            </form>
        </div>
        <div class="prediction">
            <div class="waiting-prediction">
                <h1>Waiting for Predictions</h1>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                    </svg>
            </div>
            <div class="prediction_header hidden">
                <div class="prediction_header_content">
                    <p>Prediction</p>
                    <h2></h2>
                    <h3></h3>
                </div>
                <div class="confidence-bar">
                    <div class="confidence-bar__fill"
                    ></div>
                </div>
            </div>
            <div class="top_k_predictions hidden">
                <h3>Other Predictions</h3>
                <div class="top-k-list"></div>
                <p class="response-time"></p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 ridhaginanjar</p>
    </footer>
</body>
<script>
    const API_URL = "http://localhost:8000/upload-image";

    const imageInput = document.querySelector("#image-submit");
    const imagePreview = document.querySelector("#image-preview");
    const uploadButton = document.querySelector(".upload-button");
    const resetButton = document.querySelector("#reset");
    const predictionForm = document.querySelector("#prediction-form");

    const waitingPrediction = document.querySelector(".waiting-prediction");
    const predictionHeader = document.querySelector(".prediction_header");
    const predictionTitle = document.querySelector(".prediction_header_content h2");
    const predictionConfidence = document.querySelector(".prediction_header_content h3");
    const mainConfidenceBar = document.querySelector(".prediction_header .confidence-bar__fill");
    const topPredictions = document.querySelector(".top_k_predictions");
    const topPredictionList = document.querySelector(".top-k-list");
    const responseTimeText = document.querySelector(".response-time");

    const imageMetadataText = document.querySelector(".image-metadata p");

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (!file) {
            return;
        }

        const imageUrl = URL.createObjectURL(file);

        imagePreview.src = imageUrl;

        const fileName = file.name;
        const fileSize = (file.size / 1024).toFixed(2);
        imageMetadataText.textContent = `File: ${fileName} - ${fileSize} kb`

        imagePreview.classList.remove("hidden");
        uploadButton.classList.add("hidden");
    });

    resetButton.addEventListener("click", () => {
        imagePreview.classList.add("hidden");
        imagePreview.removeAttribute("src");
        uploadButton.classList.remove("hidden");

        resetPredictionOutput();
    });

    predictionForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const file = imageInput.files[0];

        if (!file) {
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
            const startTime = performance.now();

            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    Accept: "application/json",
                },
                body: formData,
            });

            if (!response.ok) {
                throw new Error(`Prediction request failed: ${response.status}`);
            }

            const endTime = performance.now();
            const apiResponseTime = `${(endTime - startTime).toFixed(2)} ms`;
            const predictionResponse = await response.json();
            const predictions = predictionResponse.map(formatPrediction);

            updatePredictionOutput(predictions, apiResponseTime);
        } catch (error) {
            console.error(error);
        }
    });

    function formatPrediction(predictionText) {
        const [label, confidence] = predictionText.split(":");

        return {
            label: label.trim(),
            confidence: parseFloat(confidence),
        };
    }

    function updatePredictionOutput(predictions, apiResponseTime) {
        const [bestPrediction, ...otherPredictions] = predictions;

        predictionTitle.textContent = bestPrediction.label;
        predictionConfidence.textContent = `${bestPrediction.confidence}%`;
        mainConfidenceBar.style.width = `${bestPrediction.confidence}%`;

        topPredictionList.innerHTML = "";

        otherPredictions.forEach((prediction) => {
            const topPredictionItem = `
                <div class="top_k_predictions__group">
                    <div class="top_k__content">
                        <h4>${prediction.label}</h4>
                        <p>${prediction.confidence}%</p>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-bar__fill" style="width: ${prediction.confidence}%"></div>
                    </div>
                </div>
            `;

            topPredictionList.insertAdjacentHTML("beforeend", topPredictionItem);
        });

        responseTimeText.textContent = `Response Time: ${apiResponseTime}`;
        waitingPrediction.classList.add("hidden");
        predictionHeader.classList.remove("hidden");
        topPredictions.classList.remove("hidden");
    }

    function resetPredictionOutput() {
        predictionTitle.textContent = "";
        predictionConfidence.textContent = "";
        mainConfidenceBar.style.width = "0%";
        topPredictionList.innerHTML = "";
        responseTimeText.textContent = "";
        imageMetadataText.textContent = "";

        waitingPrediction.classList.remove("hidden");
        predictionHeader.classList.add("hidden");
        topPredictions.classList.add("hidden");
    }
</script>
</html>
