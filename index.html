<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Inference Engineering - FE</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-content">
        <h1>Computer Vision Inference Engineering - Image Classification</h1>
        <p>Upload an image and run inference to see what the model predicts</p>
    </header>
    <main class="main-content">
        <div class="prediction-container">
            <div class="prediction-info">
                <h3>Image Input</h3>
                <p>Model details: MobileNetV4 - ImageNet</p>
            </div>
            <div class="image-container">
                <img id="image-preview" class="image-preview hidden" alt="Image preview">
            </div>
            <form action="submit" method="post" id="prediction-form">
                <input type="file" name="image-submit" id="image-submit" accept="image/*" class="hidden">
                <label for="image-submit" class="upload-button">Please Upload an Image</label>

                <div class="btn-container">
                    <button type="reset" id="reset">Reset</button>
                    <button type="submit" id="predict">
                        Predict
                    </button>
                </div>
            </form>
        </div>
        <div class="prediction">
            <div class="waitingPrediction">
                <h1>Waiting for Predictions</h1>
                    <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                    </svg>
            </div>
            <div class="prediction_header hidden">
                <div class="prediction_header_content">
                    <p>Prediction</p>
                    <h2></h2>
                    <h3></h3>
                </div>
                <div class="confidence-bar">
                    <div class="confidence-bar__fill"
                    ></div>
                </div>
            </div>
            <div class="top_k_predictions hidden">
                <h3>Other Predictions</h3>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 ridhaginanjar</p>
    </footer>
</body>
<script>
    const imageInput = document.querySelector("#image-submit")
    const imagePreview = document.querySelector("#image-preview")
    const placeholder = document.querySelector(".upload-button")

    const predictionContent = document.querySelector(".prediction_header_content")
    const confidenceBar = document.querySelector(".confidence-bar__fill");
    const containerTopK = document.querySelector(".top_k_predictions");
    const containerPredictionContent = predictionContent.closest(".prediction_header")
    const mostContainer = containerPredictionContent.closest(".prediction");
    const waitingPredictionHTML = document.querySelector(".waitingPrediction")
    
    imageInput.addEventListener("change", function() {
        const file = imageInput.files[0];
        console.log(file)

        if (!file) {
            return
        }

        const imageUrl = URL.createObjectURL(file);
        console.log(imageUrl)
        
        imagePreview.src = imageUrl;
        console.log(imagePreview)

        imagePreview.classList.remove("hidden");
        placeholder.classList.remove("upload-button");
        placeholder.classList.add("hidden");
    });

    const resetPreview = document.querySelector("#reset")

    resetPreview.addEventListener("click", () => {
        imagePreview.classList.add("hidden");
        placeholder.classList.remove("hidden");
        placeholder.classList.add("upload-button");

        waitingPredictionHTML.classList.remove("hidden");
        containerTopK.classList.add("hidden");
        containerPredictionContent.classList.add("hidden");

    });

    const form = document.querySelector("#prediction-form")
    let result = null;

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const file = imageInput.files[0];

        if (!file) {
            return
        }

        const formData = new FormData()
        formData.append("file", file);

        try {
            console.log("Start Predicting!")
            const start = performance.now()

            let uri = "http://localhost:8000/upload-image"
            const responseApi = await fetch(uri, {
                method: "POST",
                headers: {
                    Accept: "application/json"
                },
                body: formData,
            })

            const end = performance.now()
            const responseTime = end - start
            console.log(responseTime)

            const responseJSON = await responseApi.json()
            console.log(responseJSON)
            const [rank1, rank1Confidence] = responseJSON[0].split(":")
            const [rank2, rank2Confidence] = responseJSON[1].split(":")
            const [rank3, rank3Confidence] = responseJSON[2].split(":")
            const [rank4, rank4Confidence] = responseJSON[3].split(":")
            const responseTimeAPI = `${responseTime.toFixed(2)} ms`
            console.log(responseTimeAPI)

            result = {
                [`${rank2}`]: rank2Confidence,
                [`${rank3}`]: rank3Confidence,
                [`${rank4}`]: rank4Confidence,
            }
            console.log(result)
            updatePredictionOutput(rank1, rank1Confidence, result, responseTimeAPI)
            console.log("End Predicting!")
        } catch (e) {
            console.log(e)
        }
    })

    function updatePredictionOutput(rank1, rank1Confidence, result, responseTimeAPI) {
        const topPredictionHeader = predictionContent.querySelector("h2")
        const topPredictionPercentage = predictionContent.querySelector("h3")
        
        topPredictionHeader.textContent = rank1
        topPredictionPercentage.textContent = `${rank1Confidence}%`
        confidenceBar.style.width = `${rank1Confidence}%`

        containerTopK.innerHTML = '';

        Object.entries(result).forEach(([key, value]) => {
            const kontenTopK = `
                <div class="top_k_predictions__group">
                    <div class="top_k__content">
                        <h4>${key}</h4>
                        <p>${value}%</p>
                     </div>
                </div>
                <div class="confidence-bar">
                    <div class="confidence-bar__fill" style="width: ${value}%"
                    ></div>
                </div>
            `
            containerTopK.insertAdjacentHTML("beforeend", kontenTopK)

            containerPredictionContent.classList.remove("hidden");
            containerTopK.classList.remove("hidden");
            waitingPredictionHTML.classList.add("hidden")
        })

        const responseTimeHTML =  `
            <p>Response Time: ${responseTimeAPI}</p>
        `
        containerTopK.insertAdjacentHTML("beforeend", responseTimeHTML)
    }

</script>
</html>
