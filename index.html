<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Inference Engineering - FE</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-content">
        <h1>Computer Vision Inference Engineering - Image Classification</h1>
        <p>Upload an image and run inference to see what the model predicts</p>
    </header>
    <main class="main-content">
        <div class="prediction-container">
            <div class="prediction-info">
                <h3>Image Input</h3>
                <p>Model details: MobileNetV4 - ImageNet</p>
            </div>
            <div class="image-container">
                <img id="image-preview" class="image-preview hidden" alt="Image preview">
            </div>
            <form action="submit" method="post" id="prediction-form">
                <input type="file" name="image-submit" id="image-submit" accept="image/*" class="hidden">
                <label for="image-submit" class="upload-button">Please Upload an Image</label>

                <div class="btn-container">
                    <button type="reset" id="reset">Reset</button>
                    <button type="submit" id="predict">
                        Predict
                    </button>
                </div>
            </form>
        </div>
        <div class="prediction">
            <div class="prediction_header">
                <div class="prediction_header_content">
                    <p>Prediction</p>
                    <h2>Output: Class</h2>
                    <h3>75.9%</h3>
                </div>
                <div class="confidence-bar">
                    <div class="confidence-bar__fill"
                    ></div>
                </div>
            </div>
            <div class="top_k_predictions">
                <h3>Top 3 Predictions</h3>
                <div class="top_k_predictions__group">
                    <div class="top_k__content">
                        <h4>Class 1</h4>
                        <p>9%</p>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-bar__fill"
                        ></div>
                    </div>
                </div>
                <div class="top_k_predictions__group">
                    <div class="top_k__content">
                        <h4>Class 2</h4>
                        <p>5%</p>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-bar__fill"
                        ></div>
                    </div>
                </div>
                <div class="top_k_predictions__group">
                    <div class="top_k__content">
                        <h4>Class 2</h4>
                        <p>3%</p>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-bar__fill"
                        ></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 ridhaginanjar</p>
    </footer>
</body>
<script>
    const imageInput = document.querySelector("#image-submit")
    const imagePreview = document.querySelector("#image-preview")
    const placeholder = document.querySelector(".upload-button")
    
    imageInput.addEventListener("change", function() {
        const file = imageInput.files[0];
        console.log(file)

        if (!file) {
            return
        }

        const imageUrl = URL.createObjectURL(file);
        console.log(imageUrl)
        
        imagePreview.src = imageUrl;
        console.log(imagePreview)

        imagePreview.classList.remove("hidden");
        placeholder.classList.remove("upload-button");
        placeholder.classList.add("hidden");
    });

    const resetPreview = document.querySelector("#reset")

    resetPreview.addEventListener("click", () => {
        imagePreview.classList.add("hidden");
        placeholder.classList.remove("hidden");
        placeholder.classList.add("upload-button");
    });

    const form = document.querySelector("#prediction-form")

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const file = imageInput.files[0];

        if (!file) {
            return
        }

        const formData = new FormData()
        formData.append("file", file);

        try {
            console.log("Start Predicting!")
            let uri = "http://localhost:8000/upload-image"
            const response = await fetch(uri, {
                method: "POST",
                headers: {
                    Accept: "application/json"
                },
                body: formData,
            })

            const result = await response.json()
            console.log(result)
            console.log("End Predicting!")
        } catch (e) {
            console.log(e)
        }
    })

</script>
</html>
